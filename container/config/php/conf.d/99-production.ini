; PHP Production Configuration for PHP 7.2.34
; Applied to both CLI and FPM

[PHP]
; Security
expose_php = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
allow_url_fopen = On
allow_url_include = Off

; Error handling
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
ignore_repeated_errors = On
ignore_repeated_source = On

; Resource limits (can be overridden by FPM pool)
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
post_max_size = 105M
upload_max_filesize = 100M
max_file_uploads = 20

; CGI security
cgi.fix_pathinfo = 0

; File uploads
file_uploads = On
upload_tmp_dir = /tmp

; Session
session.save_handler = files
session.save_path = "/usr/share/nginx/html/runtime/session"
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_only_cookies = 1
session.cookie_secure = 0
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 1440

; Session upload progress - Disabled for CVE-2026-109619 mitigation
session.upload_progress.enabled = Off

; Timezone
date.timezone = Asia/Shanghai

; OPcache settings (see opcache.ini for full configuration)

; Realpath cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; mbstring
mbstring.language = Neutral
mbstring.internal_encoding = UTF-8
mbstring.http_output = UTF-8
mbstring.encoding_translation = Off

; Variables order
variables_order = "EGPCS"
request_order = "GP"
