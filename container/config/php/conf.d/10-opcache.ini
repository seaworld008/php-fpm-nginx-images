; OPcache configuration for immutable code deployments
; For PHP 7.2.34

[opcache]
; Enable OPcache
opcache.enable = 1
opcache.enable_cli = 0

; Memory settings
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY:-256}
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Validation settings
; For immutable images (code bundled in image): set to 0
; For mounted code volumes: set to 1
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-0}
opcache.revalidate_freq = 0

; Code features
opcache.save_comments = 1
opcache.enable_file_override = 0

; Optimization
opcache.optimization_level = 0x7FFFFFFF
opcache.max_wasted_percentage = 5
opcache.use_cwd = 1
opcache.consistency_checks = 0

; Note: opcache.fast_shutdown was removed in PHP 7.2.0, do not use
