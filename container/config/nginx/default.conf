# Default server configuration - Will be overridden by Jenkins deployment
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html/public;
    index index.php index.html index.htm;

    error_log /usr/share/nginx/logs/error.log;
    access_log /usr/share/nginx/logs/access.log main;

    # Gzip compression for this location
    gzip on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml application/json text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # ThinkPHP routing
    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
            break;
        }
    }

    # PHP-FPM processing
    location ~ .+\.php($|/) {
        root /usr/share/nginx/html/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php7.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;
    }

    # Static files caching
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|flv|ico)$ {
        expires 30d;
        access_log off;
    }

    location ~ .*\.(js|css)?$ {
        expires 7d;
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\.(ht|git|vscode|idea) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
