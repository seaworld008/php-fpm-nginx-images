# Main application server block for ThinkPHP
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /usr/share/nginx/html/public;
    index index.php index.html;

    # Logging
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ /(\.git|\.env|\.htaccess|\.htpasswd|composer\.(json|lock)|package(-lock)?\.json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup files
    location ~ \.(bak|backup|old|save|swp|swo)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static files - serve directly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Main location - ThinkPHP routing
    location / {
        # Try to serve file directly, fallback to ThinkPHP router
        try_files $uri $uri/ @thinkphp;
    }

    # ThinkPHP rewrite rules
    location @thinkphp {
        rewrite ^(.*)$ /index.php?s=$1 last;
    }

    # PHP-FPM handler - ONLY for index.php
    location = /index.php {
        include /etc/nginx/fastcgi-thinkphp.conf;
        fastcgi_pass unix:/run/php/php7.2-fpm.sock;
    }

    # Explicitly deny execution of any other PHP files
    location ~ \.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to non-public application directories
    location ~ ^/(application|vendor|runtime|config|extend|thinkphp)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Favicon and robots.txt
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}

# Admin/health check server on loopback only
server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;

    # Liveness probe - Nginx is running
    location /live {
        return 200 "alive\n";
        add_header Content-Type text/plain;
    }

    # Readiness probe - Check FPM and draining status
    location /ready {
        access_log off;
        if (-f /run/app/draining) {
            return 503 "draining\n";
        }
        # Also check FPM ping
        fastcgi_pass unix:/run/php/php7.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /fpm_ping;
        include /etc/nginx/fastcgi_params;
    }

    # FPM status endpoint
    location /fpm_status {
        access_log off;
        fastcgi_pass unix:/run/php/php7.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /fpm_status;
        include /etc/nginx/fastcgi_params;
    }

    # FPM ping endpoint
    location /fpm_ping {
        access_log off;
        fastcgi_pass unix:/run/php/php7.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /fpm_ping;
        include /etc/nginx/fastcgi_params;
    }

    # Nginx stub status (optional)
    location /nginx_status {
        stub_status;
    }
}
